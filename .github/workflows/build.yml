name: Build QuickDNS

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Application & Tests
      run: cmake --build build --config Release

    - name: Run Unit Tests (Exclude Live Network Tests)
      working-directory: build
      run: ctest -C Release --output-on-failure -LE network

    - name: Package Release
      shell: pwsh
      run: |
        Copy-Item -Path build/Release/QuickDNS.exe -Destination QuickDNS.exe -Force
        (Get-FileHash build/Release/QuickDNS.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline QuickDNS.exe.sha256
        ./scripts/package_release.ps1
        New-Item -ItemType Directory -Force -Path release-dist | Out-Null
        Copy-Item -Path build/Release/QuickDNS.exe -Destination release-dist/QuickDNS.exe -Force
        Copy-Item -Path QuickDNS.exe.sha256 -Destination release-dist/QuickDNS.exe.sha256 -Force
        Copy-Item -Path dist/*.zip -Destination release-dist/ -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickDNS-Release-x64
        path: |
          release-dist/*
          build/Release/test_dns.exe
          build/Release/test_config.exe
          build/Release/test_benchmark.exe
          build/Release/test_smartdns_verifier.exe
          build/Release/test_updater.exe

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: QuickDNS-Release-x64
        path: release_files

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_files/QuickDNS.exe
          release_files/QuickDNS.exe.sha256
          release_files/*.zip
        generate_release_notes: true
        append_body: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
