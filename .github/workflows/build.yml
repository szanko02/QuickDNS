name: Build QuickDNS

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Application & Tests
      run: cmake --build build --config Release

    - name: Run Unit Tests (Exclude Live Network Tests)
      working-directory: build
      run: ctest -C Release --output-on-failure -LE network

    - name: Package Release
      shell: pwsh
      run: |
        Copy-Item -Path build/Release/QuickDNS.exe -Destination QuickDNS.exe -Force
        (Get-FileHash build/Release/QuickDNS.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline QuickDNS.exe.sha256
        ./scripts/package_release.ps1
        New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
        Copy-Item -Path QuickDNS.exe -Destination release-artifacts/QuickDNS.exe -Force
        Copy-Item -Path QuickDNS.exe.sha256 -Destination release-artifacts/QuickDNS.exe.sha256 -Force
        Copy-Item -Path dist/*.zip -Destination release-artifacts/ -Force
        Copy-Item -Path RELEASE_NOTES.md -Destination release-artifacts/RELEASE_NOTES.md -Force

    - name: Upload Release Files
      uses: actions/upload-artifact@v4
      with:
        name: QuickDNS-Release-Files
        path: release-artifacts/*

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: QuickDNS-Release-Files
        path: artifacts

    - name: List Release Files
      shell: pwsh
      run: Get-ChildItem -Recurse artifacts

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: QuickDNS v2.0.4 - Reliable Auto-Updater, Single-Instance Race Fix & Process Hand-off
        body_path: artifacts/RELEASE_NOTES.md
        files: |
          artifacts/QuickDNS.exe
          artifacts/QuickDNS.exe.sha256
          artifacts/*.zip
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
