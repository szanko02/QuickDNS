name: Build QuickDNS

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -S . -A x64 -DCMAKE_BUILD_TYPE=Release -DQUICKDNS_EMBED_SING_BOX=OFF
        cmake -B build-embedded -S . -A x64 -DCMAKE_BUILD_TYPE=Release -DQUICKDNS_EMBED_SING_BOX=ON

    - name: Build Application & Tests
      run: cmake --build build --config Release --parallel 4

    - name: Build Optional Embedded Edition
      run: cmake --build build-embedded --config Release --target QuickDNS test_dialog_app_routing --parallel 4

    - name: Run Unit Tests (Exclude Live Network Tests)
      working-directory: build
      shell: pwsh
      run: |
        Copy-Item -LiteralPath ../build-embedded/routing-engine/sing-box.exe -Destination Release/sing-box.exe
        $env:QUICKDNS_EXPECT_COLOCATED_ENGINE = (Resolve-Path Release/sing-box.exe).Path
        ctest -C Release --output-on-failure -LE network
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir ../build-embedded -C Release --output-on-failure -R '^TestDialogAppRouting$'

    - name: Package Release
      shell: pwsh
      run: |
        ./scripts/package_release.ps1 -Executable build/Release/QuickDNS.exe -RoutingEngine build-embedded/routing-engine/sing-box.exe
        New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
        Copy-Item -Path build/Release/QuickDNS.exe -Destination release-artifacts/QuickDNS.exe -Force
        Copy-Item -Path build-embedded/Release/QuickDNS.exe -Destination release-artifacts/QuickDNS-Embedded.exe -Force
        foreach ($name in 'QuickDNS.exe', 'QuickDNS-Embedded.exe') {
            $path = Join-Path release-artifacts $name
            (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -Encoding ascii -NoNewline "$path.sha256"
        }
        Copy-Item -Path dist/*.zip -Destination release-artifacts/ -Force
        Copy-Item -Path RELEASE_NOTES.md -Destination release-artifacts/RELEASE_NOTES.md -Force

    - name: Upload Release Files
      uses: actions/upload-artifact@v4
      with:
        name: QuickDNS-Release-Files
        path: release-artifacts/*

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: QuickDNS-Release-Files
        path: artifacts

    - name: List Release Files
      shell: pwsh
      run: Get-ChildItem -Recurse artifacts

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: QuickDNS v2.2.4 - Routing Interface and Secondary Network for Web Traffic
        body_path: artifacts/RELEASE_NOTES.md
        files: |
          artifacts/QuickDNS.exe
          artifacts/QuickDNS.exe.sha256
          artifacts/QuickDNS-Embedded.exe
          artifacts/QuickDNS-Embedded.exe.sha256
          artifacts/*.zip
        generate_release_notes: false
        fail_on_unmatched_files: true
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
